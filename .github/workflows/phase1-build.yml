name: Phase 1 Build Verification
on:
  push:
    branches: [build-1md-engine, engine-generalization-20261007, phase3-md2-gate-a-20261008, phase3-md2-gate-c-20261008]
  pull_request:
    branches: [build-1md-engine, phase3-md2-gate-a-20261008]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build

      - name: Phase 2 1MD1 pilot package build smoke test
        run: npx tsx scripts/phase2-pilot-smoke.ts

      - name: Phase 3 Gate A source onboarding smoke test
        run: npm run test:phase3-gate-a

      - name: Phase 3 Gate B Lecture Package smoke test
        run: npm run test:phase3-gate-b

      - name: Phase 3 Gate C Grounded Script smoke test
        run: npm run test:phase3-gate-c

      - name: API and package-isolation smoke test
        shell: bash
        run: |
          npm run dev > /tmp/digital-lecturer-engine.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/course-engine/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done

          node <<'NODE'
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          const getJson = async (path) => {
            const response = await fetch('http://127.0.0.1:3000' + path);
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { body = text; }
            return { response, body };
          };

          const health = await getJson('/api/course-engine/health');
          assert(health.response.ok, 'Course Engine health endpoint failed');
          assert(health.body.ok === true, 'Course Engine health is not ok');
          assert(health.body.packageCount === 10, 'Expected 10 lesson packages');

          const coursePackages = await getJson('/api/course-engine/courses/COURSE-1MD/packages');
          assert(coursePackages.response.ok, 'Course package listing failed');
          assert(coursePackages.body.packages.length === 10, 'Course must expose exactly 10 packages');

          const packageIds = new Set(coursePackages.body.packages.map(p => p.packageId));
          assert(packageIds.size === 10, 'Package IDs must be unique');

          for (let n = 1; n <= 10; n++) {
            const pkg = coursePackages.body.packages[n - 1];
            assert(pkg.lessonNumber === n, `Package order mismatch at lesson ${n}`);
            assert(pkg.packageId === `LPKG-1MD${n}-001`, `Wrong package ID at lesson ${n}`);
            assert(pkg.courseId === 'COURSE-1MD', `Wrong course at lesson ${n}`);
            assert(pkg.commonSourceSetId === 'COMMON-1MD', `Wrong common source set at lesson ${n}`);
            assert(pkg.isolated === true, `Package ${n} is not marked isolated`);
          }

          const p1 = await getJson('/api/course-engine/courses/COURSE-1MD/packages/1');
          assert(p1.response.ok, '1MD1 package lookup failed');
          assert(p1.body.package.packageId === 'LPKG-1MD1-001', '1MD1 resolved to wrong package');

          const p10 = await getJson('/api/course-engine/courses/COURSE-1MD/packages/10');
          assert(p10.response.ok, '1MD10 package lookup failed');
          assert(p10.body.package.packageId === 'LPKG-1MD10-001', '1MD10 resolved to wrong package');

          const buildPilot = await fetch('http://127.0.0.1:3000/api/course-engine/packages/LPKG-1MD1-001/build-pilot', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              courseId: 'COURSE-1MD',
              level1: {
                sourceId: 'SRC-1MD1-L1', filename: '1.MĐ1.docx', documentType: 'DOCX', sourceLevel: 1,
                title: '1.MĐ1', author: 'source', year: 2026, publisher: 'source', pageCount: 37,
                status: 'REGISTERED', extractedText: 'verified source text', metadata: {
                  fileSize: 41330, extractedAt: '2026-10-01T00:00:00.000Z',
                  checksum: '8dbc58d73bda58f526154a7e3ac354daee52c244e54f992596fc314f03a42192'
                }
              },
              level3: {
                sourceId: 'SRC-1MD1-L3', filename: '1.MĐ1.pptx', documentType: 'PPTX', sourceLevel: 3,
                title: '1.MĐ1', author: 'source', year: 2026, publisher: 'source', pageCount: 1, slideCount: 52,
                status: 'REGISTERED', extractedText: 'verified source text', metadata: {
                  fileSize: 73779028, extractedAt: '2026-10-01T00:00:00.000Z',
                  checksum: 'a2b609ea525583d6e1fb3be7ef84002664f06d51c61794053b0edc96853e3c0b'
                }
              },
              mapping: [{blockId:'B1',slideStart:1,slideEnd:52,durationSeconds:11100}]
            })
          });
          const buildPilotText = await buildPilot.text();
          let buildPilotBody; try { buildPilotBody = JSON.parse(buildPilotText); } catch { buildPilotBody = buildPilotText; }
          assert(buildPilot.ok, '1MD1 build-pilot POST failed');
          assert(buildPilotBody.success === true, '1MD1 build-pilot did not return success');
          assert(buildPilotBody.package.slideCount === 52, '1MD1 pilot must preserve 52 slides');
          assert(buildPilotBody.package.timing.totalActualSeconds === 11100, '1MD1 pilot timing mismatch');
          assert(buildPilotBody.package.contentPolicy === 'SOURCE_AUTHORITATIVE_READ_ONLY', 'Source protection policy missing');

          const expectedOnboardedPackages = {
            2: { title: 'Những phạm trù cơ bản của Mỹ học Mác - Lênin', status: 'QC_PENDING' },
            3: { title: 'Giáo dục thẩm mỹ', status: 'CONTENT_READY' },
            4: { title: 'Đạo đức, đạo đức học, đạo đức học quân sự', status: 'CONTENT_READY' },
            5: { title: 'Những phạm trù cơ bản của Đạo đức học quân sự', status: 'CONTENT_READY' },
            6: { title: 'Đạo đức quân nhân', status: 'CONTENT_READY' },
            7: { title: 'Những vấn đề chung về tôn giáo và Tôn giáo học', status: 'CONTENT_READY' },
            8: { title: 'Một số tôn giáo lớn trên thế giới', status: 'QC_PENDING' },
            9: { title: 'Tín ngưỡng, tôn giáo bản địa Việt Nam', status: 'CONTENT_READY' }
          };
          for (const [lesson, expected] of Object.entries(expectedOnboardedPackages)) {
            const pkg = coursePackages.body.packages[Number(lesson) - 1];
            assert(pkg.title === expected.title, `Wrong title for 1MD${lesson}`);
            assert(pkg.status === expected.status, `Unexpected status for 1MD${lesson}: ${pkg.status}`);
            assert(pkg.sourceSlots.level1.status === 'REGISTERED', `1MD${lesson} Level 1 source not registered`);
            assert(pkg.sourceSlots.level3.status === 'REGISTERED', `1MD${lesson} Level 3 source not registered`);
          }

          const p7 = await getJson('/api/course-engine/resolve/COURSE-1MD/LPKG-1MD7-001');
          assert(p7.response.ok, '1MD7 package resolution failed');
          assert(p7.body.package.packageId === 'LPKG-1MD7-001', '1MD7 resolved to wrong package');

          const cross = await getJson('/api/course-engine/resolve/COURSE-1MD/LPKG-CS401-007');
          assert(cross.response.status === 404, 'Cross-package isolation guard did not reject unknown package');

          console.log('PHASE 1 API/ISOLATION SMOKE TEST: PASS');
          NODE
