name: Phase 1 Build Verification
on:
  push:
    branches: [build-1md-engine, engine-generalization-20261007]
  pull_request:
    branches: [build-1md-engine, phase3-md2-gate-c-20261008]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build

      - name: Phase 2 1MD1 pilot package build smoke test
        run: npx tsx scripts/phase2-pilot-smoke.ts

      - name: Phase 3 Gate A source onboarding smoke test
        run: npm run test:phase3-gate-a

      - name: Phase 3 Gate B Lecture Package smoke test
        run: npm run test:phase3-gate-b

      - name: Phase 3 Gate C Grounded Script smoke test
        run: npm run test:phase3-gate-c

      - name: API and package-isolation smoke test
        run: npx tsx scripts/api-course-engine-smoke.ts

      - name: Phase 3 Gate D TTS/Audio policy smoke test
        run: npm run test:phase3-gate-d

      - name: Ten-lesson readiness audit and storage-policy smoke test
        run: npm run test:ten-lesson-readiness
